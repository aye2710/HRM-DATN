databases:
  - name: hrm-db
    databaseName: hrm_db
    user: hrm_user
    plan: free
    region: singapore

services:
  # =========================================================================
  # 1. DỊCH VỤ BACKEND API (Node.js Express + Prisma ORM)
  # =========================================================================
  - type: web
    name: hrm-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npx tsx scripts/init_cloud_db.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hrm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: xongtruc2004@gmail.com
      - key: SMTP_PASS
        value: "vsgi bvaf jdwb ippg"
      - key: EMAIL_FROM
        value: "Công ty TNHH LLA - Phòng Nhân Sự <xongtruc2004@gmail.com>"

  # =========================================================================
  # 2. DỊCH VỤ FRONTEND WEB (React Vite SPA - Tự động định tuyến CDN)
  # =========================================================================
  - type: web
    name: hrm-frontend
    env: static
    rootDir: hrm-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hrm-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

